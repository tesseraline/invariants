# Publish to PyPI when a version tag (v0.0.1, v0.1.0, ...) is pushed.
# Trusted Publishing: PyPI trusts this workflow, so no API token is stored anywhere.
# The "pypi" environment requires a maintainer's approval before the upload step runs.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: the tag matches the version in pyproject.toml
        run: |
          version="$(uv version --short)"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: tests
        run: uv sync --locked --all-extras && uv run pytest -q -p no:invariants -m "not benchmark"  # the speed target is for a laptop, not a shared runner
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
          SEMGREP_SEND_METRICS: "off"
      - name: build
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tesseraline-invariants
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
