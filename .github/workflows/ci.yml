# Tests, lint and types on every push and pull request.
name: ci

on:
  push:
    branches: [production, staging, development]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked --all-extras
      - run: uv tool install "semgrep==1.185.0"   # for the rule tests; kept out of the lock
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src
      - name: known vulnerabilities in the locked dependencies
        run: |
          uv export --frozen --all-extras --all-groups --no-emit-project --no-hashes --format requirements-txt > deps.txt
          uvx "pip-audit==2.10.1" -r deps.txt --no-deps --disable-pip --progress-spinner off
      - run: uv run pytest -q -p no:invariants -m "not benchmark"
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
          SEMGREP_SEND_METRICS: "off"
