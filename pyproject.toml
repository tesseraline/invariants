# tesseraline-invariants/pyproject.toml.

[project]
name = "tesseraline-invariants"
version = "0.0.1"
description = "Promises about what a function's output may contain, checked by code and recorded in a lock file."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Tesseraline" }]
# The decorator and Secret need the standard library only, so production images carry no test tooling.
# Checking needs the "check" extra: pip install "tesseraline-invariants[check]".
dependencies = []

[project.optional-dependencies]
check = [
    "structlog>=24.1.0",   # developer log (decision 8e)
    "hypothesis>=6.110.0", # inputs built from types (decision 8a, gap 1)
    "pydantic>=2.7.0",     # settings at the boundary; SecretStr recognised (decision 8c)
]
scan = ["semgrep>=1.85.0"]   # `invariants scan`: the rules for unguarded exits

[project.scripts]
invariants = "tesseraline_invariants.entrypoints.cli:main"

[project.entry-points.pytest11]
invariants = "tesseraline_invariants.entrypoints.pytest_plugin"

[dependency-groups]
dev = [
    "tesseraline-invariants[check]",   # the check itself, for our own tests
    # --- Lint + format ---
    "ruff>=0.6.0",                # lint + format, --watch capable

    # --- Types ---
    "mypy>=1.11.0",               # primary type checker
    # "ty>=0.0.1a1",              # optional: Astral's faster type checker (preview)

    # --- Tests ---
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-watcher>=0.4.2",      # `ptw` — re-run on file change

    # --- Profiling ---
    "pyinstrument>=4.7.0",

    # --- The user-facing Semgrep rules, tested end to end ---
    "semgrep>=1.85.0",
]

# ------------------------------------------------------------------
# Build backend (using hatchling — uv's default for `uv init --package`)
# ------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tesseraline_invariants"]

# ------------------------------------------------------------------
# uv
# ------------------------------------------------------------------
[tool.uv]
default-groups = ["dev"]

# ------------------------------------------------------------------
# Ruff (lint + format) — covers flake8, black, isort, pyupgrade, bandit, ...
# ------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # flake8-bugbear
    "C4",            # comprehensions
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "ANN",           # annotations
    "ASYNC",         # async correctness
    "S",             # bandit (security)
    "PL",            # pylint subset
    "TRY",           # exception-handling style
    "PT",            # pytest style
    "PTH",           # prefer pathlib
    "RET",           # return statements
    "ARG",           # unused arguments
    "TCH",           # type-checking imports
    "TID",           # tidy imports
    "ERA",           # eradicate commented-out code
    "PERF",          # perflint
    "FURB",          # refurb
    "LOG",           # logging correctness
    "DTZ",           # naive datetimes
    "N",             # naming
    "D",             # pydocstyle
    "T",             # flake8-print (no print outside CLI entrypoints)
]
ignore = [
    "PLR0913",           # too many args (use dataclass when it fires)
    "D100", "D104",      # missing module / package docstring
    "D203", "D213",      # conflicting docstring rules — pick one
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py"               = ["S101", "S603", "S607", "ANN", "D", "PLR2004", "ARG", "TC"]   # TC: annotations are read at run time
"src/*/examples/**/*.py"      = ["S311", "ARG", "D"]
"src/*/entrypoints/**/*.py"   = ["T201"]   # print is allowed in CLI entrypoints
"examples/**/*.py"            = ["TC", "D", "ANN", "S311"]   # sample code; annotations read at run time

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ------------------------------------------------------------------
# pytest
# ------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-p", "no:invariants",   # our own plugin loads before coverage starts; its tests run it in a subprocess
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: long-running test (skip with -m 'not slow')",
    "integration: hits external services",
    "characterization: pins existing behavior",
]

# ------------------------------------------------------------------
# coverage
# ------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

# ------------------------------------------------------------------
# mypy — strict by default
# ------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
